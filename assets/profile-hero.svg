<svg width="1200" height="360" viewBox="0 0 1200 360" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">William Cull-Whitten profile hero</title>
  <desc id="desc">A mission-control inspired profile banner for embedded systems, robotics, space software, and computer vision.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#05070D"/>
      <stop offset="0.45" stop-color="#081422"/>
      <stop offset="1" stop-color="#120817"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5EEAD4"/>
      <stop offset="1" stop-color="#38BDF8"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FDE68A"/>
      <stop offset="1" stop-color="#F59E0B"/>
    </linearGradient>
    <linearGradient id="violet" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#A78BFA"/>
      <stop offset="1" stop-color="#F472B6"/>
    </linearGradient>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feColorMatrix in="blur" type="matrix" values="0 0 0 0 0.25 0 0 0 0 0.95 0 0 0 0 1 0 0 0 0.38 0"/>
      <feBlend in="SourceGraphic" mode="screen"/>
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" stroke="#213047" stroke-width="1" opacity="0.45"/>
    </pattern>
  </defs>

  <rect width="1200" height="360" rx="0" fill="url(#bg)"/>
  <rect width="1200" height="360" fill="url(#grid)" opacity="0.65"/>
  <path d="M0 300C190 250 360 286 545 244C730 202 886 92 1200 122" stroke="#38BDF8" stroke-width="2" opacity="0.28"/>
  <path d="M0 324C170 284 346 306 520 280C705 252 864 178 1200 216" stroke="#F59E0B" stroke-width="2" opacity="0.24"/>
  <path d="M820 50C900 95 966 160 1014 258" stroke="#5EEAD4" stroke-width="1.5" stroke-dasharray="8 10" opacity="0.48"/>

  <g opacity="0.8">
    <path d="M67 52H256" stroke="#38BDF8" stroke-width="2"/>
    <circle cx="62" cy="52" r="4" fill="#5EEAD4"/>
    <circle cx="262" cy="52" r="4" fill="#38BDF8"/>
    <path d="M966 304H1133" stroke="#A78BFA" stroke-width="2"/>
    <circle cx="960" cy="304" r="4" fill="#F472B6"/>
    <circle cx="1139" cy="304" r="4" fill="#A78BFA"/>
  </g>

  <g transform="translate(56 42)">
    <rect x="0" y="0" width="478" height="34" rx="6" fill="#0B1220" stroke="#26344C"/>
    <circle cx="20" cy="17" r="5" fill="#FB7185"/>
    <circle cx="38" cy="17" r="5" fill="#FBBF24"/>
    <circle cx="56" cy="17" r="5" fill="#34D399"/>
    <text x="82" y="22" fill="#94A3B8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">mission-control://william.cull-whitten</text>
  </g>

  <g transform="translate(56 112)">
    <text x="0" y="0" fill="#E5F3FF" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="58" font-weight="800">William Cull-Whitten</text>
    <text x="2" y="36" fill="#7DD3FC" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" font-weight="700">Computer Engineering Co-op | MUN | St. John's, NL</text>
    <text x="2" y="72" fill="#CBD5E1" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="22">Embedded systems, robotics, space software, and computer vision.</text>
  </g>

  <g transform="translate(58 234)" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="700">
    <rect x="0" y="0" width="168" height="34" rx="6" fill="#0D1B2A" stroke="#38BDF8"/>
    <text x="16" y="22" fill="#BAE6FD">MUNStar-1 ADCS</text>
    <rect x="184" y="0" width="164" height="34" rx="6" fill="#171426" stroke="#A78BFA"/>
    <text x="200" y="22" fill="#DDD6FE">YOLOv8 + RTDE</text>
    <rect x="364" y="0" width="152" height="34" rx="6" fill="#20160A" stroke="#F59E0B"/>
    <text x="380" y="22" fill="#FDE68A">PCB to firmware</text>
    <rect x="532" y="0" width="150" height="34" rx="6" fill="#071B14" stroke="#34D399"/>
    <text x="548" y="22" fill="#BBF7D0">Team captain</text>
  </g>

  <g transform="translate(58 302)" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <text x="0" y="0" fill="#94A3B8" font-size="13">ST. JOHN'S</text>
    <path d="M95 -4H188" stroke="#475569" stroke-width="2"/>
    <path d="M188 -4L178 -10M188 -4L178 2" stroke="#475569" stroke-width="2"/>
    <text x="207" y="0" fill="#94A3B8" font-size="13">STUTTGART</text>
    <path d="M303 -4H396" stroke="#475569" stroke-width="2"/>
    <path d="M396 -4L386 -10M396 -4L386 2" stroke="#475569" stroke-width="2"/>
    <text x="415" y="0" fill="#FDE68A" font-size="13" font-weight="700">ORBIT</text>
  </g>

  <g transform="translate(724 70)">
    <rect x="0" y="0" width="402" height="210" rx="8" fill="#09111F" stroke="#26344C"/>
    <rect x="16" y="18" width="370" height="28" rx="5" fill="#101B2D"/>
    <text x="30" y="37" fill="#94A3B8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12">/systems/live-build</text>
    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">
      <text x="30" y="75" fill="#5EEAD4">adcs.stabilize()</text>
      <text x="208" y="75" fill="#94A3B8">quaternion OK</text>
      <text x="30" y="104" fill="#A78BFA">vision.map(robot_frame)</text>
      <text x="246" y="104" fill="#94A3B8">rtde linked</text>
      <text x="30" y="133" fill="#F59E0B">pcb.route(signal)</text>
      <text x="210" y="133" fill="#94A3B8">drc clean</text>
      <text x="30" y="162" fill="#34D399">firmware.flash()</text>
      <text x="208" y="162" fill="#94A3B8">hid ready</text>
    </g>
    <rect x="30" y="184" width="302" height="8" rx="4" fill="#132036"/>
    <rect x="30" y="184" width="246" height="8" rx="4" fill="url(#cyan)" filter="url(#softGlow)"/>
    <text x="344" y="192" fill="#BAE6FD" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11">82%</text>
  </g>

  <g transform="translate(1042 58) scale(0.82)">
    <path d="M-124 34C-68 -50 46 -56 112 20" stroke="#38BDF8" stroke-width="1.5" stroke-dasharray="7 9" opacity="0.48"/>
    <g transform="rotate(-18)" filter="url(#softGlow)">
      <rect x="-42" y="-15" width="84" height="30" rx="6" fill="#E5E7EB" stroke="#94A3B8"/>
      <rect x="-87" y="-22" width="38" height="44" rx="4" fill="#0EA5E9" stroke="#BAE6FD"/>
      <rect x="49" y="-22" width="38" height="44" rx="4" fill="#0EA5E9" stroke="#BAE6FD"/>
      <path d="M-49 0H49" stroke="#64748B" stroke-width="4"/>
      <circle cx="0" cy="0" r="8" fill="#F59E0B"/>
      <path d="M-78 -12H-58M-78 0H-58M-78 12H-58M58 -12H78M58 0H78M58 12H78" stroke="#BAE6FD" stroke-width="2" opacity="0.8"/>
    </g>
  </g>

  <g opacity="0.66">
    <path d="M1017 32H1100V82H1157" stroke="#34D399" stroke-width="2"/>
    <circle cx="1017" cy="32" r="4" fill="#34D399"/>
    <circle cx="1157" cy="82" r="4" fill="#34D399"/>
    <path d="M646 306H724V330H790" stroke="#F59E0B" stroke-width="2"/>
    <circle cx="646" cy="306" r="4" fill="#F59E0B"/>
    <circle cx="790" cy="330" r="4" fill="#F59E0B"/>
  </g>
</svg>
